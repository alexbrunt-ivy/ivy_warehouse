version: 2

models:
  # ──────────────────────────────────────────────────────────────────────
  # stg_huds_bedrijven
  # ──────────────────────────────────────────────────────────────────────
  - name: stg_huds_bedrijven
    description: >
      Bedrijven (klanten) uit HUDS, opgeschoond en met juiste datatypes.
    columns:
      - name: bedrijf_id
        description: Uniek ID van het bedrijf
        data_tests:
          - not_null
          - unique:
              config:
                severity: warn
      - name: bedrijfsnaam
        description: Naam van het bedrijf
        data_tests:
          - not_null
      - name: normalized_name
        description: Opgeschoonde bedrijfsnaam voor fuzzy matching
        data_tests:
          - not_null:
              config:
                severity: warn

  # ──────────────────────────────────────────────────────────────────────
  # stg_huds_facturen
  # ──────────────────────────────────────────────────────────────────────
  - name: stg_huds_facturen
    description: >
      Facturen uit HUDS, opgeschoond en met juiste datatypes.
    columns:
      - name: factuur_nummer
        description: Factuurnummer (niet uniek op zichzelf; hergebruikt per project)
        data_tests:
          - not_null
      - name: project_nummer
        description: Afgeleid projectnummer uit project_raw
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: factuurdatum
        description: Datum van de factuur
        data_tests:
          - not_null
      - name: vervaldatum
        description: Vervaldatum van de factuur
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: status
        description: Status van de factuur
        data_tests:
          - not_null
      - name: bedrag_inc_btw
        description: Factuurbedrag inclusief BTW
        data_tests:
          - not_null
      - name: is_factuur_voldaan
        description: Of de factuur betaald is (true/false)
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
              config:
                severity: warn

  # ──────────────────────────────────────────────────────────────────────
  # stg_huds_projecten
  # ──────────────────────────────────────────────────────────────────────
  - name: stg_huds_projecten
    description: >
      Projecten uit HUDS, opgeschoond en met juiste datatypes.
    columns:
      - name: project_nummer
        description: Uniek projectnummer
        data_tests:
          - not_null
          - unique:
              config:
                severity: warn
      - name: project_id
        description: Intern ID van het project
        data_tests:
          - unique
          - not_null
      - name: projectnaam
        description: Naam van het project
        data_tests:
          - not_null
      - name: status
        description: Status van het project
        data_tests:
          - not_null
      - name: start_datum
        description: Startdatum van het project
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: opdrachtgever
        description: Opdrachtgever van het project
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: bedrijfsentiteit
        description: Bedrijfsentiteit waaraan het project is gekoppeld
        data_tests:
          - not_null:
              config:
                severity: warn

  # ──────────────────────────────────────────────────────────────────────
  # stg_huds_uren
  # ──────────────────────────────────────────────────────────────────────
  - name: stg_huds_uren
    description: >
      Urenregistraties uit HUDS, opgeschoond en met juiste datatypes.
    columns:
      - name: uren_nummer
        description: Uniek nummer van de urenregistratie
        data_tests:
          - not_null
          - unique:
              config:
                severity: warn
      - name: project_raw
        description: Originele projectstring uit HUDS (bijv. "12345 - Projectnaam")
      - name: project
        description: Alias van project_raw; behouden voor backward compatibility
      - name: project_nummer
        description: Afgeleid projectnummer uit het begin van project_raw
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: projectnaam_uit_veld
        description: Afgeleide projectnaam na verwijderen van nummer en scheidingstekens
      - name: is_project_leeg
        description: True wanneer project_raw null of leeg is
      - name: uren
        description: Aantal gewerkte uren
        data_tests:
          - not_null
      - name: tarief
        description: Uurtarief in euro's (NUMERIC)
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: medewerker_naam
        description: Naam van de medewerker
        data_tests:
          - not_null:
              config:
                severity: warn

  # ──────────────────────────────────────────────────────────────────────
  # stg_huds_uurtarieven
  # ──────────────────────────────────────────────────────────────────────
  - name: stg_huds_uurtarieven
    description: >
      Uurtarieven per project en rol uit HUDS.
    columns:
      - name: project_nummer
        description: Projectnummer waarop het tarief van toepassing is
        data_tests:
          - not_null
      - name: rol
        description: De rol waarvoor het tarief geldt
        data_tests:
          - not_null
      - name: uurtarief
        description: Het uurtarief in euro's
        data_tests:
          - not_null
      - name: start_datum
        description: Startdatum vanaf wanneer het tarief geldig is
        data_tests:
          - not_null:
              config:
                severity: warn
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - project_nummer
              - rol
              - start_datum

  # ──────────────────────────────────────────────────────────────────────
  # stg_huds_facturatie_overzicht
  # ──────────────────────────────────────────────────────────────────────
  - name: stg_huds_facturatie_overzicht
    description: >
      Maandelijks facturatie-overzicht per project met uren per rol.
    columns:
      - name: project_raw
        description: Originele projectstring uit HUDS
      - name: project
        description: Alias van project_raw
      - name: project_nummer
        description: Afgeleid projectnummer uit project_raw
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: projectnaam_uit_veld
        description: Afgeleide projectnaam uit project_raw
      - name: is_project_leeg
        description: True wanneer project_raw null of leeg is
      - name: periode
        description: De maand (als datum) van het overzicht
        data_tests:
          - not_null
      - name: totaal_uren
        description: Totaal aantal uren in deze periode
      - name: totaal_omzet
        description: Totale omzet in deze periode
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - project_raw
              - periode
          config:
            where: "not is_project_leeg"

  # ──────────────────────────────────────────────────────────────────────
  # stg_huds_uren_omzet_planning
  # ──────────────────────────────────────────────────────────────────────
  - name: stg_huds_uren_omzet_planning
    description: >
      Geplande uren en omzet per project per maand, uitgesplitst per rol.
    columns:
      - name: project_raw
        description: Originele projectstring uit HUDS
      - name: project
        description: Alias van project_raw
      - name: project_nummer
        description: Afgeleid projectnummer uit project_raw
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: projectnaam_uit_veld
        description: Afgeleide projectnaam uit project_raw
      - name: is_project_leeg
        description: True wanneer project_raw null of leeg is
      - name: periode
        description: De maand (als datum) van de planning
        data_tests:
          - not_null
      - name: totaal_uren
        description: Totaal geplande uren
      - name: totaal_omzet
        description: Totaal geplande omzet
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - project_raw
              - periode
          config:
            where: "not is_project_leeg"

  # ──────────────────────────────────────────────────────────────────────
  # stg_huds_uren_omzet_realisatie
  # ──────────────────────────────────────────────────────────────────────
  - name: stg_huds_uren_omzet_realisatie
    description: >
      Gerealiseerde uren en omzet per project per maand, uitgesplitst per rol.
    columns:
      - name: project_raw
        description: Originele projectstring uit HUDS
      - name: project
        description: Alias van project_raw
      - name: project_nummer
        description: Afgeleid projectnummer uit project_raw
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: projectnaam_uit_veld
        description: Afgeleide projectnaam uit project_raw
      - name: is_project_leeg
        description: True wanneer project_raw null of leeg is
      - name: periode
        description: De maand (als datum) van de realisatie
        data_tests:
          - not_null
      - name: totaal_uren
        description: Totaal gerealiseerde uren
      - name: totaal_omzet
        description: Totaal gerealiseerde omzet
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - project_raw
              - periode
          config:
            where: "not is_project_leeg"
               
  # ──────────────────────────────────────────────────────────────────────
  # stg_huds_werknemers_intern
  # ──────────────────────────────────────────────────────────────────────
  - name: stg_huds_werknemers_intern
    description: >
      Interne werknemersgegevens uit HUDS.
    columns:
      - name: werknemer_id
        description: Uniek ID van de werknemer
        data_tests:
          - not_null
          - unique:
              config:
                severity: warn
      - name: werknemer_naam
        description: Naam van de werknemer
        data_tests:
          - not_null
      - name: afdeling
        description: Afdeling van de werknemer
        data_tests:
          - not_null:
              config:
                severity: warn

  # ──────────────────────────────────────────────────────────────────────
  # stg_hubspot_bedrijven
  # ──────────────────────────────────────────────────────────────────────
  - name: stg_hubspot_bedrijven
    description: >
      Bedrijven uit HubSpot, gereduceerd naar kernvelden en opgeschoond met juiste datatypes.
    columns:
      - name: bedrijf_id
        description: Uniek HubSpot ID van het bedrijf
        data_tests:
          - unique
          - not_null
      - name: bedrijfsnaam
        description: Bedrijfsnaam uit HubSpot
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: normalized_name
        description: Opgeschoonde bedrijfsnaam voor fuzzy matching
      - name: website
        description: Primair domein van het bedrijf
      - name: created_at
        description: Technische aanmaakdatum van het HubSpot record
      - name: updated_at
        description: Laatste technische wijzigingsdatum van het HubSpot record
      - name: jaarlijkse_omzet
        description: Jaaromzet zoals geregistreerd in HubSpot
      - name: hs_analytics_source
        description: Originele analytics bron van het bedrijf
      - name: hs_analytics_latest_source
        description: Laatste analytics bron van het bedrijf

  # ──────────────────────────────────────────────────────────────────────
  # stg_hubspot_contacten
  # ──────────────────────────────────────────────────────────────────────
  - name: stg_hubspot_contacten
    description: >
      Contacten uit HubSpot, gereduceerd naar kernvelden en opgeschoond met juiste datatypes.
    columns:
      - name: contact_id
        description: Uniek HubSpot ID van het contact
        data_tests:
          - unique
          - not_null
      - name: email
        description: E-mailadres van het contact
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: first_name
        description: Voornaam van het contact
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: last_name
        description: Achternaam van het contact
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: associated_company_id
        description: HubSpot ID van het gekoppelde bedrijf
      - name: company_id
        description: Bedrijfs-ID uit HubSpot of externe bron
      - name: created_at
        description: Technische aanmaakdatum van het HubSpot record
      - name: updated_at
        description: Laatste technische wijzigingsdatum van het HubSpot record
      - name: is_currently_in_workflow
        description: Of het contact momenteel in een HubSpot workflow zit
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
              config:
                severity: warn